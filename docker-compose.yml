services:
  a-mfa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amfa-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/amfa.sqlite
    volumes:
      - amfa-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  amfa-data:
    driver: local
